<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portaal & Countdown Beheer Pro</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
:root {
  --bg: linear-gradient(135deg, #0b1329 0%, #172554 45%, #1e1b4b 100%);
  --card: rgba(15, 23, 42, 0.92);
  --border: rgba(99, 102, 241, 0.25);
  --accent: #8b5cf6;
  --glow: rgba(139, 92, 246, 0.4);
}

/* ===== THEMA DEFINITIES VIA VARIABELEN ===== */
body.theme-cyberpunk {
  --bg: linear-gradient(135deg, #0b1329 0%, #172554 45%, #1e1b4b 100%);
  --card: rgba(15, 23, 42, 0.92);
  --border: rgba(99, 102, 241, 0.25);
  --accent: #8b5cf6;
  --glow: rgba(139, 92, 246, 0.4);
}
body.theme-sinterklaas {
  --bg: linear-gradient(135deg, #5c0606 0%, #991b1b 50%, #450a0a 100%);
  --card: rgba(30, 4, 4, 0.93);
  --border: rgba(245, 158, 11, 0.35);
  --accent: #f59e0b;
  --glow: rgba(245, 158, 11, 0.4);
}
body.theme-kerst {
  --bg: linear-gradient(135deg, #064e3b 0%, #022c22 60%, #111827 100%);
  --card: rgba(6, 28, 22, 0.94);
  --border: rgba(239, 68, 68, 0.35);
  --accent: #ef4444;
  --glow: rgba(239, 68, 68, 0.4);
}
body.theme-koningsdag {
  --bg: linear-gradient(135deg, #7c2d12 0%, #ea580c 50%, #1e1b4b 100%);
  --card: rgba(26, 12, 5, 0.94);
  --border: rgba(59, 130, 246, 0.4);
  --accent: #3b82f6;
  --glow: rgba(234, 88, 12, 0.5);
}
body.theme-valentijn {
  --bg: linear-gradient(135deg, #4c0519 0%, #9f1239 50%, #881337 100%);
  --card: rgba(36, 4, 13, 0.93);
  --border: rgba(244, 114, 182, 0.35);
  --accent: #f472b6;
  --glow: rgba(244, 114, 182, 0.4);
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
body {
  background: var(--bg);
  color: #f8fafc;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px;
  padding-bottom: 50px;
  overflow-x: hidden;
  position: relative;
  transition: background 0.5s ease;
}

#effectCanvas {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  pointer-events: none;
  z-index: 1;
}

.app-container {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 1100px;
}

/* ===== AUTH STYLING UIT JOUW CODE ===== */
.auth-wrapper {
  width: 100%; min-height: 100vh;
  display: flex; justify-content: center; align-items: center;
  position: relative; overflow: hidden;
}
.auth-bg-circle {
  position: absolute; border-radius: 50%;
  filter: blur(90px); opacity: 0.35; pointer-events: none;
}
.auth-bg-circle.c1 { width: 420px; height: 420px; background: #8b5cf6; top: -120px; left: -80px; animation: float 12s ease-in-out infinite; }
.auth-bg-circle.c2 { width: 320px; height: 320px; background: #3b82f6; bottom: -80px; right: -60px; animation: float 15s ease-in-out infinite reverse; }
@keyframes float { 0%,100% { transform: translate(0,0); } 50% { transform: translate(30px,20px); } }

.auth-card {
  background: rgba(15, 23, 42, 0.88);
  border: 1px solid rgba(139, 92, 246, 0.3);
  border-radius: 28px;
  padding: 42px 38px;
  width: 100%; max-width: 420px;
  backdrop-filter: blur(20px);
  box-shadow: 0 25px 60px rgba(0,0,0,0.5), 0 0 40px rgba(139,92,246,0.08);
  animation: authIn 0.55s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative; z-index: 2;
}
@keyframes authIn {
  from { opacity: 0; transform: translateY(28px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.auth-logo { font-size: 2.6rem; margin-bottom: 6px; text-align: center; }
.auth-card h1 { font-size: 1.65rem; font-weight: 700; margin-bottom: 4px; text-align: center; }
.auth-card .subtitle { color: #94a3b8; font-size: 0.92rem; margin-bottom: 26px; text-align: center; }

.auth-tabs {
  display: flex; background: rgba(0,0,0,0.3);
  border-radius: 14px; padding: 4px; margin-bottom: 24px;
}
.auth-tab {
  flex: 1; padding: 10px; border-radius: 11px; border: none;
  background: transparent; color: #94a3b8; font-weight: 600;
  font-size: 0.9rem; cursor: pointer; transition: all 0.25s;
}
.auth-tab.active {
  background: var(--accent); color: white;
  box-shadow: 0 4px 14px rgba(139,92,246,0.4);
}

.form-group { margin-bottom: 15px; text-align: left; }
.form-group label { display: block; font-size: 0.82rem; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
.form-group input, .form-group select {
  width: 100%; padding: 13px 15px;
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px; color: white; font-size: 0.95rem;
  outline: none; transition: border 0.2s, box-shadow 0.2s;
}
.form-group select option { background: #0f172a; color: white; }
.form-group input:focus, .form-group select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(139,92,246,0.2);
}

.btn {
  background: var(--accent); color: white; border: none;
  padding: 13px 20px; font-size: 0.95rem; font-weight: 600;
  border-radius: 12px; cursor: pointer; transition: all 0.25s;
  box-shadow: 0 4px 16px var(--glow);
}
.btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
.btn-full { width: 100%; }

.secret-buttons {
  position: absolute; top: 16px; right: 16px;
  display: flex; gap: 8px; z-index: 20;
}
.secret-btn {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.45);
  font-size: 0.75rem; font-weight: 600;
  padding: 7px 12px; border-radius: 10px;
  cursor: pointer; transition: all 0.25s;
}
.secret-btn:hover { color: white; background: rgba(255,255,255,0.12); }
.secret-btn.staff:hover { border-color: rgba(14,165,233,0.5); color: #7dd3fc; }

/* ===== APP INTERFACE ELEMENTEN ===== */
.app-wrapper { width: 100%; display: none; }
.app-wrapper.active { display: block; }

nav {
  width: 100%;
  display: flex; justify-content: space-between; align-items: center;
  background: var(--card); backdrop-filter: blur(16px);
  border: 1px solid var(--border); padding: 10px 16px;
  border-radius: 16px; margin-bottom: 20px; flex-wrap: wrap; gap: 8px;
  animation: fadeDown 0.4s ease;
}
.nav-links { display: flex; gap: 3px; flex-wrap: wrap; }
.nav-btn {
  background: none; border: none; color: #94a3b8;
  font-size: 0.8rem; font-weight: 600; cursor: pointer;
  padding: 7px 11px; border-radius: 9px; transition: all 0.25s;
}
.nav-btn.active, .nav-btn:hover { color: white; background: rgba(139,92,246,0.28); }

.container { width: 100%; display: none; flex-direction: column; gap: 16px; }
.container.active { display: flex; animation: fadeIn 0.35s ease; }

.content-card, .timer-card, .holiday-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 18px; padding: 22px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  transition: transform 0.25s, border-color 0.4s ease;
}
.timer-card:hover, .holiday-card:hover { transform: translateY(-3px); }

.timer-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.timer-title { font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.countdown-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.time-box { background: rgba(0,0,0,0.35); border-radius: 12px; padding: 12px 4px; text-align: center; }
.time-value { font-size: 1.6rem; font-weight: 800; text-shadow: 0 0 12px var(--glow); color:#fff; }
.time-label { font-size: 0.65rem; text-transform: uppercase; color: #94a3b8; margin-top: 3px; }

/* Thema-specifieke randkleuren uit je eerste code */
.timer-card.sinterklaas, .holiday-card.sinterklaas { border-color: rgba(239,68,68,0.4); }
.timer-card.kerst, .holiday-card.kerst { border-color: rgba(34,197,94,0.4); }
.timer-card.koningsdag, .holiday-card.koningsdag { border-color: rgba(249,115,22,0.4); }
.timer-card.valentijn, .holiday-card.valentijn { border-color: rgba(244,114,182,0.4); }

.clock-big { font-size: 3.6rem; font-weight: 800; text-align: center; text-shadow: 0 0 30px var(--glow); margin: 8px 0; }
.clock-date { text-align: center; color: #cbd5e1; font-size: 1.1rem; font-weight: 500; margin-bottom: 8px; }

/* Thema selectie elementen */
.theme-showcase-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 10px; }
.theme-preview-card {
  padding: 12px; border-radius: 12px; text-align: center; cursor: pointer;
  font-weight: 600; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.1); transition: all 0.2s;
}
.theme-preview-card.active { border-color: var(--accent); box-shadow: 0 0 12px var(--glow); }

.admin-card { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05); border-radius: 14px; padding: 16px; margin-top: 10px; }
</style>
</head>
<body class="theme-cyberpunk">

<canvas id="effectCanvas"></canvas>

<div class="secret-buttons">
  <button class="secret-btn staff" onclick="bypassAuth()">⚡ Dev Login</button>
</div>

<div class="app-container">
  <!-- ===== INLOGSCHERM ===== -->
  <div class="auth-wrapper" id="authScreen">
    <div class="auth-bg-circle c1"></div>
    <div class="auth-bg-circle c2"></div>
    
    <div class="auth-card">
      <div class="auth-logo">⏳</div>
      <h1>Welkom terug</h1>
      <div class="subtitle">Selecteer een opstartstijl om in te loggen</div>
      
      <div class="form-group">
        <label>Directe Opstartstijl</label>
        <select id="initialThemeSelect" onchange="changeTheme(this.value)">
          <option value="cyberpunk">🌌 Cyberpunk (Standaard)</option>
          <option value="sinterklaas">🎁 Sinterklaas (Pepernoten)</option>
          <option value="kerst">🎄 Kerstmis (Sneeuwval)</option>
          <option value="koningsdag">👑 Koningsdag</option>
          <option value="valentijn">💖 Valentijn</option>
        </select>
      </div>
      
      <button class="btn btn-full" onclick="bypassAuth()">Verder gaan</button>
    </div>
  </div>

  <!-- ===== HOOFD APPLICATIE ===== -->
  <div class="app-wrapper" id="appScreen">
