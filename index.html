<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinterklaas Portaal — Radio, Kalender & Countdowns</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #381d08 0%, #451a03 50%, #7c2d12 100%);
            --card-bg: rgba(43, 24, 16, 0.85);
            --card-border: rgba(245, 158, 11, 0.3);
            --text-color: #fef3c7;
            --accent-color: #d97706;
            --accent-glow: rgba(217, 119, 6, 0.4);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            padding-bottom: 70px;
        }

        /* Navigatiebalk */
        nav {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 12px 20px;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            flex-wrap: wrap;
            gap: 10px;
        }
        .nav-links { display: flex; gap: 6px; flex-wrap: wrap; }
        .nav-btn {
            background: none;
            border: none;
            color: #d1d5db;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .nav-btn.active, .nav-btn:hover { color: #fff; background: rgba(217, 119, 6, 0.3); }
        .nav-btn.owner-btn { color: #fde047; border: 1px dashed rgba(234, 179, 8, 0.5); background: rgba(202, 138, 4, 0.15); }
        .nav-btn.owner-btn:hover { background: rgba(202, 138, 4, 0.3); }

        /* General Layout */
        .container {
            width: 100%;
            max-width: 1000px;
            display: none;
            flex-direction: column;
            gap: 20px;
        }
        .container.active { display: flex; }

        /* Login Pagina met Beheerknop rechtsboven */
        .auth-top-bar {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }
        .auth-wrapper {
            width: 100%;
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(16px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
        }

        /* Countdown Cards */
        .timer-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .timer-header { display: flex; justify-content: space-between; align-items: center; }
        .timer-title { font-size: 1.4rem; font-weight: 700; display: flex; align-items: center; gap: 10px; color: #fef3c7; }
        .countdown-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .time-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 12px;
            padding: 15px 5px;
            text-align: center;
        }
        .time-value { font-size: 2rem; font-weight: 800; color: #fff; line-height: 1; text-shadow: 0 0 10px var(--accent-glow); }
        .time-label { font-size: 0.75rem; text-transform: uppercase; color: #d1d5db; font-weight: 600; margin-top: 5px; }

        /* Content & Tables */
        .content-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(0,0,0,0.25);
            border-radius: 12px;
            overflow: hidden;
            margin-top: 15px;
        }
        .data-table th, .data-table td {
            padding: 14px 18px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .data-table th { background: rgba(0,0,0,0.4); color: #fde047; font-size: 0.9rem; }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .status-actief { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
        .status-open { background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }
        .status-gesloten { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

        /* Uitklapbare Secties (+ / -) */
        .accordion-section {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 14px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        .accordion-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 700;
            color: #fef3c7;
            background: rgba(0, 0, 0, 0.2);
            transition: background 0.2s;
        }
        .accordion-header:hover { background: rgba(217, 119, 6, 0.2); }
        .accordion-content { padding: 20px; display: none; }
        .accordion-section.open .accordion-content { display: block; }
        .toggle-icon {
            font-size: 1.2rem;
            font-weight: 800;
            color: #fde047;
            background: rgba(255,255,255,0.08);
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }

        /* Klikbare resterende tijd link */
        .clickable-time {
            color: #fde047;
            font-weight: 700;
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.2s;
        }
        .clickable-time:hover { color: #fef08a; }

        /* Radio Speler */
        .radio-player-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }
        .radio-stations { display: flex; gap: 10px; flex-wrap: wrap; }

        /* Jaar Knoppen */
        .year-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .year-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .year-btn.active { background: var(--accent-color); border-color: var(--accent-color); }

        /* Buttons & Forms */
        .btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px var(--accent-glow);
        }
        .btn:hover { filter: brightness(1.15); transform: translateY(-1px); }
        .btn-danger { background: #b91c1c; box-shadow: 0 4px 15px rgba(185, 28, 28, 0.4); }
        .btn-owner { background: #b45309; box-shadow: 0 4px 15px rgba(180, 83, 9, 0.4); }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: #fde047; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 12px; background: rgba(0,0,0,0.4);
            border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 8px; color: white; font-size: 0.9
