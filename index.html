<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn Countdown Website</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
            --accent-color: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.4);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
            transition: background 0.5s ease;
        }
        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            position: relative;
            z-index: 10;
        }
        .icon-display { font-size: 3.5rem; margin-bottom: 15px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        h1 { font-size: 2.2rem; font-weight: 700; margin-bottom: 30px; letter-spacing: -0.5px; }
        .countdown-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 40px; }
        .time-box {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .time-value { font-size: 2.8rem; font-weight: 800; color: #fff; line-height: 1; margin-bottom: 8px; text-shadow: 0 0 20px var(--accent-glow); }
        .time-label { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1.5px; color: #94a3b8; font-weight: 600; }
        .btn-group { display: flex; gap: 12px; justify-content: center; }
        .btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px var(--accent-glow);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-secondary { background: rgba(255, 255, 255, 0.1); box-shadow: none; border: 1px solid rgba(255, 255, 255, 0.15); }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.15); }
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px); z-index: 100;
            justify-content: center; align-items: center; padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #1e1b4b; border: 1px solid rgba(255, 255, 255, 0.15);
            width: 100%; max-width: 500px; border-radius: 24px; padding: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5); text-align: left; max-height: 90vh; overflow-y: auto; color: white;
        }
        .modal-content h2 { margin-bottom: 20px; font-size: 1.5rem; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; color: #cbd5e1; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px; background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; color: white; font-size: 1rem;
        }
        .event-list { margin-top: 15px; max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .event-item {
            background: rgba(255, 255, 255, 0.05); padding: 12px 15px; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .event-item-info { display: flex; align-items: center; gap: 12px; }
        .event-item-actions { display: flex; gap: 8px; }
        .icon-btn { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 1.1rem; padding: 5px; }
        .icon-btn.delete:hover { color: #ef4444; }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-display" id="displayIcon">🎉</div>
        <h1 id="displayTitle">Nieuwjaar</h1>
        
        <div class="countdown-grid">
            <div class="time-box"><span class="time-value" id="days">00</span><span class="time-label">Dagen</span></div>
            <div class="time-box"><span class="time-value" id="hours">00</span><span class="time-label">Uur</span></div>
            <div class="time-box"><span class="time-value" id="minutes">00</span><span class="time-label">Minuten</span></div>
            <div class="time-box"><span class="time-value" id="seconds">00</span><span class="time-label">Seconden</span></div>
        </div>

        <div class="btn-group">
            <button class="btn" onclick="openManager()">📋 Beheer Events</button>
            <button class="btn btn-secondary" onclick="openAddModal()">➕ Nieuw Event</button>
        </div>
    </div>

    <!-- Modal: Beheer -->
    <div class="modal" id="managerModal">
        <div class="modal-content">
            <h2>Jouw Countdowns</h2>
            <div class="event-list" id="eventListContainer"></div>
            <div style="margin-top: 20px; text-align: right;">
                <button class="btn btn-secondary" onclick="closeModals()">Sluiten</button>
            </div>
        </div>
    </div>

    <!-- Modal: Toevoegen -->
    <div class="modal" id="formModal">
        <div class="modal-content">
            <h2 id="formModalTitle">Nieuwe Countdown</h2>
            <form id="eventForm" onsubmit="saveEvent(event)">
                <input type="hidden" id="eventId">
                <div class="form-group">
                    <label>Titel van het evenement</label>
                    <input type="text" id="eventTitle" required placeholder="Bijv. Vakantie">
                </div>
                <div class="form-group">
                    <label>Datum en Tijd</label>
                    <input type="datetime-local" id="eventDate" required>
                </div>
                <div class="form-group">
                    <label>Emoji / Icoon</label>
                    <input type="text" id="eventIcon" value="🌴" required maxlength="2">
                </div>
                <div class="form-group">
                    <label>Stijl / Kleurachtergrond</label>
                    <select id="eventTheme">
                        <option value="linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%)">Donker Paars / Blauw</option>
                        <option value="linear-gradient(135deg, #134e5e 0%, #71b280 100%)">Fris Groen / Oceaan</option>
                        <option value="linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%)">Zwoel Rood / Oranje</option>
                        <option value="linear-gradient(135deg, #2b5876 0%, #4e4376 100%)">Diep Blauw / Paars</option>
                        <option value="linear-gradient(135deg, #f7971e 0%, #ffd200 100%)">Zonnig Geel / Oranje</option>
                    </select>
                </div>
                <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 25px;">
                    <button type="button" class="btn btn-secondary" onclick="closeModals()">Annuleren</button>
                    <button type="submit" class="btn">Opslaan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let events = JSON.parse(localStorage.getItem('countdown_events')) || [
            {
                id: 'default-1',
                title: 'Nieuwjaar',
                date: new Date(new Date().getFullYear() + 1, 0, 1, 0, 0, 0).toISOString(),
                icon: '🎆',
                theme: 'linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%)'
            }
        ];

        let activeEventId = localStorage.getItem('countdown_active_id') || events[0].id;
        let timerInterval = null;

        function getActiveEvent() {
            let found = events.find(e => e.id === activeEventId);
            if (!found && events.length > 0) {
                found = events[0];
                activeEventId = found.id;
            }
            return found;
        }

        function updateCountdown() {
            const currentEvent = getActiveEvent();
            if (!currentEvent) return;

            document.getElementById('displayTitle').innerText = currentEvent.title;
            document.getElementById('displayIcon').innerText = currentEvent.icon;
            document.body.style.background = currentEvent.theme;

            const now = new Date().getTime();
            const targetTime = new Date(currentEvent.date).getTime();
            const difference = targetTime - now;

            if (difference <= 0) {
                document.getElementById('days').innerText = '00';
                document.getElementById('hours').innerText = '00';
                document.getElementById('minutes').innerText = '00';
                document.getElementById('seconds').innerText = '00';
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = String(days).padStart(2, '0');
            document.getElementById('hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
            document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
        }

        function initTimer() {
            if (timerInterval) clearInterval(timerInterval);
            updateCountdown();
            timerInterval = setInterval(updateCountdown, 1000);
        }

        function openManager() {
            renderEventList();
            document.getElementById('managerModal').classList.add('active');
        }

        function openAddModal() {
            document.getElementById('formModalTitle').innerText = 'Nieuwe Countdown';
            document.getElementById('eventId').value = '';
            document.getElementById('eventTitle').value = '';
            document.getElementById('eventDate').value = '';
            document.getElementById('eventIcon').value = '🌴';
            document.getElementById('managerModal').classList.remove('active');
            document.getElementById('formModal').classList.add('active');
        }

        function closeModals() {
            document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
        }

        function renderEventList() {
            const container = document.getElementById('eventListContainer');
            container.innerHTML = '';
            
            events.forEach(ev => {
                const isActive = ev.id === activeEventId;
                const div = document.createElement('div');
                div.className = 'event-item';
                div.style.borderColor = isActive ? 'var(--accent-color)' : 'rgba(255,255,255,0.05)';
                
                div.innerHTML = `
                    <div class="event-item-info">
                        <span style="font-size: 1.5rem;">${ev.icon}</span>
                        <div>
                            <div style="font-weight: 600;">${ev.title}</div>
                            <div style="font-size: 0.75rem; color: #94a3b8;">${new Date(ev.date).toLocaleString()}</div>
                        </div>
                    </div>
                    <div class="event-item-actions">
                        <button class="btn" style="padding: 6px 12px; font-size: 0.8rem;" onclick="selectEvent('${ev.id}')">${isActive ? 'Actief' : 'Kies'}</button>
                        <button class="icon-btn delete" onclick="deleteEvent('${ev.id}')">🗑️</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function selectEvent(id) {
            activeEventId = id;
            localStorage.setItem('countdown_active_id', activeEventId);
            closeModals();
            initTimer();
        }

        function saveEvent(e) {
            e.preventDefault();
            const id = document.getElementById('eventId').value || 'event_' + Date.now();
            const title = document.getElementById('eventTitle').value;
            const date = document.getElementById('eventDate').value;
            const icon = document.getElementById('eventIcon').value;
            const theme = document.getElementById('eventTheme').value;

            const existingIndex = events.findIndex(ev => ev.id === id);
            if (existingIndex >= 0) {
                events[existingIndex] = { id, title, date, icon, theme };
            } else {
                events.push({ id, title, date, icon, theme });
                activeEventId = id;
                localStorage.setItem('countdown_active_id', activeEventId);
            }

            localStorage.setItem('countdown_events', JSON.stringify(events));
            closeModals();
            initTimer();
        }

        function deleteEvent(id) {
            if (events.length <= 1) {
                alert('Je moet minimaal één countdown behouden!');
                return;
            }
            events = events.filter(ev => ev.id !== id);
            localStorage.setItem('countdown_events', JSON.stringify(events));
            if (activeEventId === id) {
                activeEventId = events[0].id;
                localStorage.setItem('countdown_active_id', activeEventId);
            }
            renderEventList();
            initTimer();
        }

        initTimer();
    </script>
</body>
</html>
