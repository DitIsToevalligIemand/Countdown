<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown & Medewerkers Portaal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
            --accent-color: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.4);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Navigatie */
        nav {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            padding: 15px 25px;
            border-radius: 16px;
            margin-bottom: 25px;
        }
        .nav-links { display: flex; gap: 15px; }
        .nav-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .nav-btn.active, .nav-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.1); }

        /* Algemene Layout */
        .container {
            width: 100%;
            max-width: 900px;
            display: none;
            flex-direction: column;
            gap: 20px;
        }
        .container.active { display: flex; }

        /* Auth Kaart */
        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            margin: 40px auto;
            text-align: center;
            backdrop-filter: blur(16px);
        }

        /* Countdown Kaarten Onder Elkaar */
        .timer-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .timer-header { display: flex; justify-content: space-between; align-items: center; }
        .timer-title { font-size: 1.4rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .countdown-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .time-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 15px 5px;
            text-align: center;
        }
        .time-value { font-size: 2rem; font-weight: 800; color: #fff; line-height: 1; }
        .time-label { font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; font-weight: 600; }

        /* Medewerkers Tabel */
        .medewerkers-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--card-border);
        }
        .medewerkers-table th, .medewerkers-table td {
            padding: 16px 20px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .medewerkers-table th { background: rgba(0,0,0,0.3); font-weight: 700; color: #cbd5e1; }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .status-actief { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }

        /* Formulieren & Knoppen */
        .btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-danger { background: #ef4444; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: #cbd5e1; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px; background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white; font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <!-- Navigatiebalk -->
    <nav id="topNav" style="display: none;">
        <div class="nav-links">
            <button class="nav-btn active" onclick="showTab('timersTab')">⏳ Timers</button>
            <button class="nav-btn" onclick="showTab('medewerkersTab')">👥 Medewerkers</button>
        </div>
        <div>
            <span id="userEmailDisplay" style="font-size: 0.85rem; color: #94a3b8; margin-right: 15px;"></span>
            <button class="btn btn-danger" style="padding: 6px 12px; font-size: 0.85rem;" onclick="logout()">Uitloggen</button>
        </div>
    </nav>

        <h2 id
