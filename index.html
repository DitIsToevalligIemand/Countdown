<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinterklaas Portaal — Radio, Kalender & Countdowns</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #381d08 0%, #451a03 50%, #7c2d12 100%);
            --card-bg: rgba(43, 24, 16, 0.85);
            --card-border: rgba(245, 158, 11, 0.3);
            --text-color: #fef3c7;
            --accent-color: #d97706;
            --accent-glow: rgba(217, 119, 6, 0.4);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            padding-bottom: 70px;
        }

        /* Navigatiebalk */
        nav {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 12px 20px;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            flex-wrap: wrap;
            gap: 10px;
        }
        .nav-links { display: flex; gap: 6px; flex-wrap: wrap; }
        .nav-btn {
            background: none;
            border: none;
            color: #d1d5db;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .nav-btn.active, .nav-btn:hover { color: #fff; background: rgba(217, 119, 6, 0.3); }
        .nav-btn.owner-btn { color: #fde047; border: 1px dashed rgba(234, 179, 8, 0.5); background: rgba(202, 138, 4, 0.15); }
        .nav-btn.owner-btn:hover { background: rgba(202, 138, 4, 0.3); }

        /* General Layout */
        .container {
            width: 100%;
            max-width: 1000px;
            display: none;
            flex-direction: column;
            gap: 20px;
        }
        .container.active { display: flex; }

        /* Login Pagina */
        .auth-wrapper {
            width: 100%;
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(16px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
        }

        /* Countdown Cards */
        .timer-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .timer-header { display: flex; justify-content: space-between; align-items: center; }
        .timer-title { font-size: 1.4rem; font-weight: 700; display: flex; align-items: center; gap: 10px; color: #fef3c7; }
        .countdown-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .time-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 12px;
            padding: 15px 5px;
            text-align: center;
        }
        .time-value { font-size: 2rem; font-weight: 800; color: #fff; line-height: 1; text-shadow: 0 0 10px var(--accent-glow); }
        .time-label { font-size: 0.75rem; text-transform: uppercase; color: #d1d5db; font-weight: 600; margin-top: 5px; }

        /* Content & Tables */
        .content-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(0,0,0,0.25);
            border-radius: 12px;
            overflow: hidden;
            margin-top: 15px;
        }
        .data-table th, .data-table td {
            padding: 14px 18px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .data-table th { background: rgba(0,0,0,0.4); color: #fde047; font-size: 0.9rem; }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .status-actief { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
        .status-open { background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }

        /* Accordions (+ / -) */
        .accordion-section {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 14px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        .accordion-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 700;
            color: #fef3c7;
            background: rgba(0, 0, 0, 0.2);
            transition: background 0.2s;
        }
        .accordion-header:hover { background: rgba(217, 119, 6, 0.2); }
        .accordion-content { padding: 20px; display: none; }
        .accordion-section.open .accordion-content { display: block; }
        .toggle-icon {
            font-size: 1.2rem;
            font-weight: 800;
            color: #fde047;
            background: rgba(255,255,255,0.08);
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }

        .clickable-time {
            color: #fde047;
            font-weight: 700;
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.2s;
        }
        .clickable-time:hover { color: #fef08a; }

        /* Radio Speler */
        .radio-player-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }
        .radio-stations { display: flex; gap: 10px; flex-wrap: wrap; }

        /* Jaar Knoppen */
        .year-selector { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .year-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: white; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600;
        }
        .year-btn.active { background: var(--accent-color); border-color: var(--accent-color); }

        /* Buttons & Forms */
        .btn {
            background: var(--accent-color);
            color: white; border: none; padding: 10px 18px; font-size: 0.95rem; font-weight: 600; border-radius: 10px; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 15px var(--accent-glow);
        }
        .btn:hover { filter: brightness(1.15); transform: translateY(-1px); }
        .btn-danger { background: #b91c1c; box-shadow: 0 4px 15px rgba(185, 28, 28, 0.4); }
        .btn-owner { background: #b45309; box-shadow: 0 4px 15px rgba(180, 83, 9, 0.4); }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: #fde047; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 12px; background: rgba(0,0,0,0.4); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 8px; color: white; font-size: 0.95rem;
        }
        .rules-list { list-style-type: decimal; margin-left: 20px; line-height: 1.8; color: #fef3c7; }
        .rules-list li { margin-bottom: 10px; }

        .footer-badge {
            position: fixed; bottom: 15px; right: 20px; background: rgba(43, 24, 16, 0.95); border: 1px solid var(--card-border); padding: 8px 14px; border-radius: 12px; font-size: 0.8rem; color: #d1d5db; display: flex; align-items: center; gap: 6px; backdrop-filter: blur(8px); z-index: 1000; box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
        .verified-badge { background: #3b82f6; color: white; border-radius: 50%; width: 14px; height: 14px; display: inline-flex; justify-content: center; align-items: center; font-size: 0.65rem; font-weight: 800; }

        /* Modals */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 2000;
        }
        .modal-card {
            background: var(--card-bg); border: 1px solid var(--card-border); padding: 30px; border-radius: 20px; width: 90%; max-width: 450px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <!-- Navigatiebalk -->
    <nav id="topNav" style="display: none;">
        <div class="nav-links">
            <button class="nav-btn active" id="btnTimersTab" onclick="switchTab('timersTab')">🎁 Countdowns</button>
            <button class="nav-btn" id="btnRadioTab" onclick="switchTab('radioTab')">📻 Radio</button>
            <button class="nav-btn" id="btnCalendarTab" onclick="switchTab('calendarTab')">🎤 Kalender & Concerten</button>
            <button class="nav-btn" id="btnAboutTab" onclick="switchTab('aboutTab')">🙋 Over de Beheerder</button>
            <button class="nav-btn" id="btnTicketsTab" onclick="switchTab('ticketsTab')">🎫 Tickets</button>
            <button class="nav-btn" id="btnRulesTab" onclick="switchTab('rulesTab')">📜 Regels</button>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <span id="userDisplay" style="font-size: 0.9rem; font-weight: 700; color: #fef3c7;"></span>
            <button class="nav-btn owner-btn" id="navOwnerControlBtn" style="display: none;" onclick="switchTab('ownerControlTab')">👑 Beheer Paneel</button>
            <button class="btn btn-danger" style="padding: 6px 12px; font-size: 0.85rem;" onclick="logout()">Uitloggen</button>
        </div>
    </nav>

    <!-- BEGINSCHERM MET BEHEER INLOG RECHTSBOVEN -->
    <div id="authWrapper" class="auth-wrapper">
        <div style="width: 100%; max-width: 450px; display: flex; justify-content: flex-end; margin-bottom: 12px;">
            <button class="nav-btn owner-btn" style="padding: 8px 16px; font-size: 0.9rem;" onclick="openOwnerModalPrompt()">🔧 Beheer Inlog</button>
        </div>
        <div class="auth-card">
            <div style="font-size: 2.5rem; margin-bottom: 10px;">🎁</div>
            <h2 id="authTitle" style="margin-bottom: 8px; color: #fde047;">Sinterklaas Portaal</h2>
            <p id="authSubtitle" style="font-size: 0.85rem; color: #d1d5db; margin-bottom: 25px;">Voer je gebruikersnaam in</p>
            
            <form onsubmit="handleAuth(event)">
                <div class="form-group">
                    <label>Gebruikersnaam</label>
                    <input type="text" id="authUsername" required placeholder="Bijv. David">
                </div>
                <div class="form-group">
                    <label>Wachtwoord</label>
                    <input type="password" id="authPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 10px;" id="authSubmitBtn">Inloggen</button>
            </form>

            <div style="margin-top: 20px;">
                <p style="font-size: 0.9rem; color: #d1d5db;">
                    <span id="authToggleText">Nog geen account?</span>
                    <a href="#" onclick="toggleAuthMode()" style="color: #fde047; text-decoration: none; font-weight: 600;"> Registreren</a>
                </p>
            </div>
        </div>
    </div>

    <!-- EIGENAAR CODE INLOG MODAL -->
    <div id="ownerModal" class="modal-overlay">
        <div class="modal-card">
            <h3 style="color: #fde047; margin-bottom: 10px;">🔧 Beheerder Inloggen</h3>
            <p style="font-size: 0.85rem; color: #d1d5db; margin-bottom: 20px;">Voer de geheime beheercode in (bijv. <code>owner123</code>).</p>
            <div class="form-group">
                <input type="password" id="ownerSecretInput" placeholder="Geheime code">
            </div>
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 15px;">
                <button class="btn btn-owner" onclick="verifyOwnerCode()">Inloggen</button>
                <button class="btn btn-danger" onclick="closeOwnerModal()">Sluiten</button>
            </div>
        </div>
    </div>

    <!-- TIMER TOEVOEGEN MODAL -->
    <div id="addTimerModal" class="modal-overlay">
        <div class="modal-card" style="text-align: left;">
            <h3 style="color: #fde047; margin-bottom: 15px; text-align: center;">⏱️ Nieuwe Countdown Toevoegen</h3>
            <div class="form-group">
                <label>Titel van de Countdown</label>
                <input type="text" id="newTimerTitle" placeholder="Bijv. Kerstmis of Vakantie">
            </div>
            <div class="form-group">
                <label>Datum & T
