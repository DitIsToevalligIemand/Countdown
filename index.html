<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn Portaal — Feestdagen & Concerten</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #2b1104 0%, #3d1502 50%, #631704 100%);
            --card-bg: rgba(38, 18, 9, 0.9);
            --card-border: rgba(245, 158, 11, 0.4);
            --text-color: #fef3c7;
            --accent-color: #d97706;
            --accent-glow: rgba(217, 119, 6, 0.5);
            --glimmer-gold: #fde047;
            --theme-icon: '🎁';
            --theme-name: 'Sinterklaas Portaal';
        }

        body.christmas-theme {
            --bg-gradient: linear-gradient(135deg, #022c22 0%, #064e3b 50%, #7f1d1d 100%);
            --card-bg: rgba(15, 23, 42, 0.92);
            --card-border: rgba(52, 211, 153, 0.4);
            --text-color: #f0fdf4;
            --accent-color: #059669;
            --accent-glow: rgba(5, 150, 105, 0.5);
            --glimmer-gold: #fbbf24;
            --theme-icon: '🎄';
            --theme-name: 'Kerstmis Portaal';
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            padding-bottom: 70px;
            transition: all 0.5s ease-in-out;
        }

        /* Compact Oude Stijl Navigatie */
        nav {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            padding: 14px 22px;
            border-radius: 18px;
            margin-bottom: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            flex-wrap: wrap;
            gap: 12px;
        }
        .nav-links { display: flex; gap: 8px; flex-wrap: wrap; }
        .nav-btn {
            background: none;
            border: none;
            color: #d1d5db;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 10px;
            transition: all 0.2s;
        }
        .nav-btn.active, .nav-btn:hover { color: #fff; background: rgba(217, 119, 6, 0.35); transform: translateY(-1px); }
