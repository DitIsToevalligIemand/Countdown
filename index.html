<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portaal & Countdown Beheer Pro</title>
<style>
/* ===== BASE VARIABELEN & KERN STYLING ===== */
:root {
  --bg: linear-gradient(135deg, #0b1329 0%, #172554 45%, #1e1b4b 100%);
  --card: rgba(15, 23, 42, 0.92);
  --border: rgba(99, 102, 241, 0.25);
  --accent: #8b5cf6;
  --glow: rgba(139, 92, 246, 0.4);
}
body.theme-cyberpunk {
  --bg: linear-gradient(135deg, #0b1329 0%, #172554 45%, #1e1b4b 100%);
  --card: rgba(15, 23, 42, 0.92);
  --border: rgba(99, 102, 241, 0.25);
  --accent: #8b5cf6;
  --glow: rgba(139, 92, 246, 0.4);
}
body.theme-sinterklaas {
  --bg: linear-gradient(135deg, #4c0519 0%, #991b1b 50%, #7c2d12 100%);
  --card: rgba(30, 4, 4, 0.88);
  --border: rgba(245, 158, 11, 0.4);
  --accent: #f59e0b;
  --glow: rgba(245, 158, 11, 0.4);
}
body.theme-kerst {
  --bg: linear-gradient(135deg, #064e3b 0%, #022c22 60%, #0f172a 100%);
  --card: rgba(6, 28, 22, 0.88);
  --border: rgba(239, 68, 68, 0.4);
  --accent: #ef4444;
  --glow: rgba(239, 68, 68, 0.4);
}
body.theme-koningsdag {
  --bg: linear-gradient(135deg, #7c2d12 0%, #ea580c 50%, #172554 100%);
  --card: rgba(30, 11, 3, 0.88);
  --border: rgba(59, 130, 246, 0.4);
  --accent: #3b82f6;
  --glow: rgba(234, 88, 12, 0.5);
}
body.theme-valentijn {
  --bg: linear-gradient(135deg, #4c0519 0%, #881337 50%, #db2777 100%);
  --card: rgba(36, 4, 13, 0.88);
  --border: rgba(244, 114, 182, 0.4);
  --accent: #f472b6;
  --glow: rgba(244, 114, 182, 0.4);
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
body {
  background: var(--bg); color: #f8fafc; min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  padding: 16px; padding-bottom: 50px; overflow-x: hidden; position: relative;
  transition: background 0.6s ease;
}
#effectCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 1; }
.app-container { position: relative; z-index: 2; width: 100%; max-width: 1100px; }

/* ===== INLOG & REGISTRATIE ===== */
.auth-wrapper { width: 100%; min-height: 85vh; display: flex; justify-content: center; align-items: center; }
.auth-card {
  background: rgba(15, 23, 42, 0.88); border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 28px;
  padding: 42px 38px; width: 100%; max-width: 420px; backdrop-filter: blur(20px);
  box-shadow: 0 25px 60px rgba(0,0,0,0.5); text-align: center;
}
.auth-logo { font-size: 2.6rem; margin-bottom: 6px; }
.auth-card h1 { font-size: 1.65rem; font-weight: 700; margin-bottom: 4px; }
.auth-card .subtitle { color: #94a3b8; font-size: 0.92rem; margin-bottom: 26px; }
.auth-tabs { display: flex; background: rgba(0,0,0,0.3); border-radius: 14px; padding: 4px; margin-bottom: 24px; }
.auth-tab {
  flex: 1; padding: 10px; border-radius: 11px; border: none; background: transparent;
  color: #94a3b8; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: all 0.25s;
}
.auth-tab.active { background: var(--accent); color: white; box-shadow: 0 4px 14px rgba(139,92,246,0.4); }

.form-group { margin-bottom: 15px; text-align: left; }
.form-group label { display: block; font-size: 0.82rem; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
.form-group input, .form-group select {
  width: 100%; padding: 13px 15px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px; color: white; font-size: 0.95rem; outline: none;
}
.form-group input:focus, .form-group select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139,92,246,0.2); }

.btn {
  background: var(--accent); color: white; border: none; padding: 13px 20px; font-size: 0.95rem; font-weight: 600;
  border-radius: 12px; cursor: pointer; transition: all 0.25s; box-shadow: 0 4px 16px var(--glow);
}
.btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
.btn-full { width: 100%; }

.secret-buttons { position: absolute; top: 16px; right: 16px; display: flex; gap: 8px; z-index: 20; }
.secret-btn {
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.45);
  font-size: 0.75rem; font-weight: 600; padding: 7px 12px; border-radius: 10px; cursor: pointer;
}
.secret-btn:hover { color: white; background: rgba(255,255,255,0.12); border-color: rgba(14,165,233,0.5); }

/* ===== MAIN INTERFACE ===== */
.app-wrapper { width: 100%; display: none; }
.app-wrapper.active { display: block; }
nav {
  width: 100%; display: flex; justify-content: space-between; align-items: center; background: var(--card);
  backdrop-filter: blur(16px); border: 1px solid var(--border); padding: 10px 16px; border-radius: 16px; margin-bottom: 20px; gap: 8px;
}
.nav-links { display: flex; gap: 3px; }
.nav-btn {
  background: none; border: none; color: #94a3b8; font-size: 0.8rem; font-weight: 600;
  cursor: pointer; padding: 7px 11px; border-radius: 9px; transition: all 0.25s;
}
.nav-btn.active, .nav-btn:hover { color: white; background: rgba(139,92,246,0.28); }

.container { width: 100%; display: none; flex-direction: column; gap: 16px; }
.container.active { display: flex; }
.content-card, .timer-card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 22px; box-shadow: 0 8px 24px rgba(0,0,0,0.25); }

.timer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.timer-title { font-size: 1.2rem; font-weight: 700; }
.countdown-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.time-box { background: rgba(0,0,0,0.35); border-radius: 12px; padding: 12px 4px; text-align: center; }
.time-value { font-size: 1.6rem; font-weight: 800; text-shadow: 0 0 12px var(--glow); color: #fff; }
.time-label { font-size: 0.65rem; text-transform: uppercase; color: #94a3b8; margin-top: 3px; }

.clock-big { font-size: 3.6rem; font-weight: 800; text-align: center; text-shadow: 0 0 30px var(--glow); margin: 8px 0; }
.clock-date { text-align: center; color: #cbd5e1; font-size: 1.1rem; font-weight: 400; margin-bottom: 8px; }

.theme-showcase-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 10px; }
.theme-preview-card { padding: 15px 12px; border-radius: 12px; text-align: center; cursor: pointer; font-weight: 600; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); }
.theme-preview-card.active { border-color: var(--accent); box-shadow: 0 0 12px var(--glow); }

.interactive-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 768px) { .interactive-grid { grid-template-columns: 1fr; } }
.sound-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; margin-top: 12px; }
.sound-btn { width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 12px; border-radius: 12px; font-size: 1.2rem; cursor: pointer; }
.todo-list { list-style: none; margin-top: 12px; }
.todo-item { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }

.owner-layout { display: flex; gap: 24px; align-items: center; }
.owner-avatar { width: 100px; height: 100px; background: linear-gradient(45deg, var(--accent), #3b82f6); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 2.5rem; }
.owner-badge { background: var(--accent); color: white; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; display: inline-block; margin-bottom: 6px; }
.owner-links { display: flex; gap: 10px; margin-top: 12px; }
.owner-link { color: #fff; text-decoration: none; font-size: 0.85rem; background: rgba(255,255,255,0.08); padding: 6px 12px; border-radius: 8px; }
</style>
</head>
<body class="theme-cyberpunk">

<canvas id="effectCanvas"></canvas>

<div class="secret-buttons">
  <button class="secret-btn staff" onclick="quickDevLogin()">⚡ Dev Login</button>
</div>

<div class="app-container">
  
  <!-- ===== SYSTEM INLOGPANEEL ===== -->
  <div class="auth-wrapper" id="authScreen">
    <div class="auth-card">
      <div class="auth-logo" id="authLogoIcon">⏳</div>
      <h1 id="authTitle">Welkom terug</h1>
      <div class="subtitle" id="authSubtitle">Log in op je gepersonaliseerde countdown omgeving</div>
      
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabAuthLogin" onclick="toggleAuthMode('login')">Inloggen</button>
        <button class="auth-tab" id="tabAuthRegister" onclick="toggleAuthMode('register')">Registreren</button>
      </div>
      
      <form onsubmit="processAuth(event)">
        <div class="form-group">
          <label>E-mailadres</label>
          <input type="email" id="authEmail" placeholder="naam@voorbeeld.nl" required>
        </div>
        <div class="form-group">
          <label>Wachtwoord</label>
          <input type="password" id="authPassword" placeholder="••••••••" required>
        </div>
        <div class="form-group">
          <label>Direct Opstartthema</label>
          <select id="initialThemeSelect" onchange="changeTheme(this.value)">
            <option value="cyberpunk">🌌 Cyberpunk (Standaard)</option>
            <option value="sinterklaas">🎁 Sinterklaas (Pepernoten)</option>
            <option value="kerst">🎄 Kerstmis (Sneeuwbui)</option>
            <option value="koningsdag">👑 Koningsdag</option>
            <option value="valentijn">💖 Valentijn</option>
          </select>
        </div>
        <button type="submit" class="btn btn-full" id="authSubmitBtn" style="margin-top: 10px;">Inloggen</button>
      </form>
    </div>
  </div>

  <!-- ===== MAINSTREAM APPLICATIE ===== -->
  <div class="app-wrapper" id="appScreen">
    <nav>
      <div style="font-weight: 800; font-size: 1.2rem;">🔮 ControlPortaal</div>
      <div class="nav-links">
