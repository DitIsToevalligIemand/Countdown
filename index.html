<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Studio - Basic & TikTok/IG Connector</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg: #0f0f12;
            --card: #18181b;
            --border: #27272a;
            --accent: #d97706;
            --text: #f4f4f5;
            --text-muted: #a1a1aa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }

        nav {
            width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center;
            background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 20px; margin-bottom: 20px;
        }
        .nav-btns { display: flex; gap: 8px; }
        .nav-btn {
            background: none; border: none; color: var(--text-muted); font-weight: 600; padding: 8px 14px; border-radius: 10px; cursor: pointer; transition: 0.2s;
        }
        .nav-btn.active, .nav-btn:hover { color: #fff; background: var(--accent); }

        .container { width: 100%; max-width: 900px; display: none; flex-direction: column; gap: 20px; }
        .container.active { display: flex; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media(max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }

        .btn {
            background: var(--accent); color: #fff; border: none; padding: 12px; font-weight: 700;
            border-radius: 10px; cursor: pointer; width: 100%; text-transform: uppercase; margin-top: 10px;
        }
        .btn:hover { filter: brightness(1.1); }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--accent); margin-bottom: 6px; text-transform: uppercase; }
        .form-group input, .form-group select { width: 100%; padding: 10px; background: #09090b; border: 1px solid var(--border); border-radius: 8px; color: #fff; }

        #preview3D { width: 100%; height: 260px; background: #09090b; border-radius: 12px; border: 1px solid var(--border); }

        .color-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #09090b; padding: 12px; border-radius: 10px; border: 1px solid var(--border); }
        .color-item { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        .color-item input[type="color"] { border: none; width: 28px; height: 28px; border-radius: 6px; background: none; cursor: pointer; }
    </style>
</head>
<body>

    <nav>
        <div style="font-weight: 800; color: #fff;">PORTAL STUDIO</div>
        <div class="nav-btns">
            <button class="nav-btn active" onclick="showTab('countdowns', this)">⏱️ Countdowns</button>
            <button class="nav-btn" onclick="showTab('radio', this)">📻 Radio</button>
            <button class="nav-btn" onclick="showTab('skinCreator', this)">✨ Extra: TikTok/IG Skin Creator</button>
        </div>
    </nav>

    <!-- TAB 1: COUNTDOWNS -->
    <div id="countdowns" class="container active">
        <div class="card">
            <h3 style="margin-bottom: 15px;">Event Countdowns</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                <div style="background: #09090b; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid var(--border);">
                    <h4>🎄 Kerstmis</h4>
                    <div id="xmasTimer" style="font-size: 1.4rem; font-weight: 800; margin-top: 8px; color: var(--accent);">--:--:--</div>
                </div>
                <div style="background: #09090b; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid var(--border);">
                    <h4>📚 Examens / Toetsweek</h4>
                    <div id="examTimer" style="font-size: 1.4rem; font-weight: 800; margin-top: 8px; color: #3b82f6;">--:--:--</div>
                </div>
            </div>
        </div>
    </div>

    <!-- TAB 2: RADIO -->
    <div id="radio" class="container">
        <div class="card" style="text-align: center;">
            <h3 style="margin-bottom: 15px;">Live Radio Player</h3>
            <select id="radioSelect" onchange="switchRadio()" style="max-width: 300px; margin-bottom: 15px; padding: 10px;">
                <option value="https://stream.538.nl/538">Radio 538</option>
                <option value="https://icecast.omroep.nl/3fm-bb-mp3">NPO 3FM</option>
                <option value="https://stream.qmusic.nl/qmusic/mp3">Qmusic</option>
            </select>
            <br>
            <audio id="audioPlayer" controls style="max-width: 300px; width: 100%;"></audio>
        </div>
    </div>

    <!-- TAB 3: EXTRA - TIKTOK / INSTAGRAM SKIN CREATOR -->
    <div id="skinCreator" class="container">
        <div class="card">
            <h3 style="margin-bottom: 10px;">TikTok & Instagram AI Skin Creator</h3>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 15px;">
                Vul een TikTok/Instagram profielnaam of link in, of upload direct een bestand van het profiel.
            </p>

            <div class="grid-2">
                <div>
                    <!-- INVOERVELD VOOR TIKTOK / IG PROFIEL -->
                    <div class="form-group">
                        <label>TikTok / Instagram Profiel of Video Link</label>
                        <div style="display: flex; gap: 8px;">
                            <input type="text" id="socialInput" placeholder="@gebruikersnaam of video URL">
                            <button class="btn" style="width: auto; margin-top: 0; padding: 0 16px;" onclick="fetchSocialProfile()">Zoek</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Of Upload Bestand</label>
                        <input type="file" id="fileInput" accept="image/*,video/*" onchange="loadFile(event)">
                    </div>

                    <div class="color-grid">
                        <div class="color-item"><span>Haar</span><input type="color" id="cHair" value="#b58252" onchange="drawSkin()"></div>
                        <div class="color-item"><span>Huid</span><input type="color" id="cSkin" value="#f7cfb7" onchange="drawSkin()"></div>
                        <div class="color-item"><span>Trui / Top</span><input type="color" id="cTop" value="#c3d2e0" onchange="drawSkin()"></div>
                        <div class="color-item"><span>Broek</span><input type="color" id="cPants" value="#6b7c59" onchange="drawSkin()"></div>
                    </div>

                    <button class="btn" onclick="drawSkin()">Update Skin</button>
                </div>

                <div>
                    <label style="font-size: 0.8rem; font-weight: 700; color: var(--accent); text-transform: uppercase;">3D Character Preview</label>
                    <div id="preview3D" style="margin-top: 6px;"></div>
                    <canvas id="skinCanvas" width="64" height="64" style="display:none;"></canvas>
                    <button class="btn" style="background: #22c55e;" onclick="downloadPNG()">Download Skin (.PNG)</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showTab(id, btn) {
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(btn) btn.classList.add('active');
        }

        function switchRadio() {
            const player = document.getElementById('audioPlayer');
            player.src = document.getElementById('radioSelect').value;
            player.play();
        }

        function runTimers() {
            setInterval(() => {
                const now = new Date().getTime();
                const xmas = new Date(new Date().getFullYear(), 11, 25).getTime() - now;
                const exam = (new Date().getTime() + 14*24*3600*1000) - now;
                
                if(xmas > 0) document.getElementById('xmasTimer').innerText = `${Math.floor(xmas/(86400000))}d ${Math.floor((xmas%86400000)/3600000)}u`;
                if(exam > 0) document.getElementById('examTimer').innerText = `${Math.floor(exam/(86400000))}d ${Math.floor((exam%86400000)/3600000)}u`;
            }, 1000);
        }

        function fetchSocialProfile() {
            const val = document.getElementById('socialInput').value.trim();
            if(!val) return alert('Vul een gebruikersnaam of link in.');

            let cleanUser = val.replace('@', '');
            if(cleanUser.includes('tiktok.com') || cleanUser.includes('instagram.com')) {
                window.open(val.startsWith('http') ? val : 'https://' + val, '_blank');
            } else {
                window.open(`https://www.tiktok.com/@${cleanUser}`, '_blank');
            }
            alert(`Profiel geopend! Sla de video of foto op en upload deze hieronder om de skin automatisch te genereren.`);
        }

        function loadFile(e) {
            const file = e.target.files[0];
            if(file) drawSkin();
        }

        function drawSkin() {
            const canvas = document.getElementById('skinCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0,0,64,64);

            const cHair = document.getElementById('cHair').value;
            const cSkin = document.getElementById('cSkin').value;
            const cTop = document.getElementById('cTop').value;
            const cPants = document.getElementById('cPants').value;

            // Head Base
            ctx.fillStyle = cHair; ctx.fillRect(8,0,8,8); ctx.fillRect(0,8,8,8); ctx.fillRect(16,8,8,8); ctx.fillRect(24,8,8,8);
            ctx.fillStyle = cSkin; ctx.fillRect(16,0,8,8); ctx.fillRect(8,8,8,8);
            // Face
            ctx.fillStyle = "#ffffff"; ctx.fillRect(9,12,2,1); ctx.fillRect(13,12,2,1);
            ctx.fillStyle = "#3b82f6"; ctx.fillRect(10,12,1,1); ctx.fillRect(13,12,1,1);

            // Outer Layer Hair
            ctx.fillStyle = cHair; ctx.fillRect(40,0,8,8); ctx.fillRect(32,8,8,8); ctx.fillRect(48,8,8,8); ctx.fillRect(56,8,8,8);
            ctx.fillRect(40,8,8,3); ctx.fillRect(40,11,2,5); ctx.fillRect(46,11,2,5);

            // Torso (Cropped Sweater + Stomach)
            ctx.fillStyle = cTop; ctx.fillRect(20,16,8,4); ctx.fillRect(20,20,8,5); ctx.fillRect(32,20,8,5); ctx.fillRect(16,20,4,5); ctx.fillRect(28,20,4,5);
            ctx.fillStyle = cSkin; ctx.fillRect(28,16,8,4); ctx.fillRect(20,25,8,7); ctx.fillRect(32,25,8,7); ctx.fillRect(16,25,4,7); ctx.fillRect(28,25,4,7);

            // Arms & Legs
            ctx.fillStyle = cTop; ctx.fillRect(44,16,4,4); ctx.fillRect(44,20,4,5); ctx.fillRect(36,48,4,4); ctx.fillRect(36,52,4,5);
            ctx.fillStyle = cSkin; ctx.fillRect(44,25,4,7); ctx.fillRect(40,20,4,12); ctx.fillRect(48,20,8,12); ctx.fillRect(36,57,4,7); ctx.fillRect(32,52,4,12); ctx.fillRect(40,52,8,12);
            ctx.fillStyle = cPants; ctx.fillRect(4,16,4,4); ctx.fillRect(0,20,16,12); ctx.fillRect(20,48,4,4); ctx.fillRect(16,52,16,12);

            update3D();
        }

        let scene, camera, renderer, modelGroup;
        function init3D() {
            const box = document.getElementById('preview3D');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, box.clientWidth / box.clientHeight, 0.1, 100);
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(box.clientWidth, box.clientHeight);
            box.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.9));
            modelGroup = new THREE.Group();
            scene.add(modelGroup);
            camera.position.z = 4.5;

            (function anim(){
                requestAnimationFrame(anim);
                if(modelGroup) modelGroup.rotation.y += 0.01;
                renderer.render(scene, camera);
            })();
        }

        function update3D() {
            if(!modelGroup) return;
            while(modelGroup.children.length > 0) modelGroup.remove(modelGroup.children[0]);

            const tex = new THREE.CanvasTexture(document.getElementById('skinCanvas'));
            tex.magFilter = THREE.NearestFilter;
            const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), mat); head.position.y = 0.9;
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.4), mat); body.position.y = -0.1;
            const lArm = new THREE.Mesh(new THREE.BoxGeometry(0.35, 1.2, 0.35), mat); lArm.position.set(-0.6, -0.1, 0);
            const rArm = new THREE.Mesh(new THREE.BoxGeometry(0.35, 1.2, 0.35), mat); rArm.position.set(0.6, -0.1, 0);
            const lLeg = new THREE.Mesh(new THREE.BoxGeometry(0.38, 1.2, 0.38), mat); lLeg.position.set(-0.2, -1.3, 0);
            const rLeg = new THREE.Mesh(new THREE.BoxGeometry(0.38, 1.2, 0.38), mat); rLeg.position.set(0.2, -1.3, 0);

            modelGroup.add(head, body, lArm, rArm, lLeg, rLeg);
        }

        function downloadPNG() {
            const a = document.createElement('a');
            a.download = 'minecraft-skin.png';
            a.href = document.getElementById('skinCanvas').toDataURL();
            a.click();
        }

        window.onload = function() {
            runTimers();
            init3D();
            drawSkin();
        };
    </script>
</body>
</html>
