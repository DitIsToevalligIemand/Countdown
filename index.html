<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Portal & TikTok Skin Maker</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --card-bg: rgba(24, 12, 6, 0.85);
            --card-border: rgba(245, 158, 11, 0.35);
            --text-color: #fef3c7;
            --accent-color: #d97706;
            --accent-glow: rgba(217, 119, 6, 0.6);
            --glimmer-gold: #fde047;
            --dev-color: #3b82f6;
            --dev-glow: rgba(59, 130, 246, 0.6);
            --success-color: #22c55e;
            --success-glow: rgba(34, 197, 94, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        
        #bgCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: linear-gradient(135deg, #0f0602 0%, #1c0b04 50%, #300d01 100%);
        }

        body {
            color: var(--text-color); min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            padding: 20px; padding-bottom: 70px; overflow-x: hidden;
        }

        /* Navigatie */
        nav {
            width: 100%; max-width: 1100px;
            display: none; justify-content: space-between; align-items: center;
            background: var(--card-bg); backdrop-filter: blur(25px);
            border: 1px solid var(--card-border); padding: 14px 24px;
            border-radius: 20px; margin-bottom: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7), inset 0 1px 1px rgba(255,255,255,0.05);
        }
        .nav-links { display: flex; gap: 8px; flex-wrap: wrap; }
        .nav-btn {
            background: none; border: none; color: #d1d5db;
            font-size: 0.9rem; font-weight: 600; cursor: pointer;
            padding: 10px 16px; border-radius: 12px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-btn.active, .nav-btn:hover { 
            color: #fff; 
            background: rgba(217, 119, 6, 0.3); 
            transform: translateY(-2px); 
            box-shadow: 0 6px 15px var(--accent-glow); 
        }

        /* Containers & Cards */
        .container { width: 100%; max-width: 1100px; display: none; flex-direction: column; gap: 25px; }
        .container.active { display: flex; animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .content-card {
            background: var(--card-bg); backdrop-filter: blur(25px);
            border: 1px solid var(--card-border); border-radius: 24px;
            padding: 35px; box-shadow: 0 20px 45px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        /* Form & Inputs */
        .form-group { margin-bottom: 20px; text-align: left; width: 100%; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 8px; color: var(--glimmer-gold); text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 14px; background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 14px; color: white; font-size: 0.95rem; outline: none;
            transition: all 0.25s ease;
        }
        .form-group input:focus, .form-group select:focus { 
            border-color: var(--glimmer-gold); 
            box-shadow: 0 0 12px rgba(253, 224, 71, 0.25); 
        }

        /* Knoppen */
        .btn {
            background: linear-gradient(135deg, var(--accent-color) 0%, #b45309 100%); color: white; border: none;
            padding: 14px 24px; font-size: 0.95rem; font-weight: 700; border-radius: 14px;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 4px 15px var(--accent-glow);
            width: 100%; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .btn:hover { filter: brightness(1.2); transform: translateY(-2px); box-shadow: 0 8px 25px var(--accent-glow); }
        .btn-danger { background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%); box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4); }
        .btn-danger:hover { box-shadow: 0 8px 25px rgba(220, 38, 38, 0.6); }

        /* Skin Maker Layout */
        .skin-maker-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 25px; }
        @media(max-width: 850px) { .skin-maker-grid { grid-template-columns: 1fr; } }
        
        .skin-preview-box {
            background: rgba(0,0,0,0.6); border: 2px dashed var(--card-border);
            border-radius: 20px; min-height: 420px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; position: relative; padding: 30px; gap: 15px;
            text-align: center; backdrop-filter: blur(10px);
        }

        /* Countdown Klokken */
        .timer-card {
            background: rgba(0, 0, 0, 0.4); border: 1px solid var(--card-border); border-radius: 20px;
            padding: 25px; display: flex; flex-direction: column; gap: 15px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }
        .timer-header { display: flex; justify-content: space-between; align-items: center; }
        .timer-title { font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; gap: 10px; color: #fff; }
        .countdown-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .time-box {
            background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(245, 158, 11, 0.25);
            border-radius: 14px; padding: 16px 8px; text-align: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .time-value { font-size: 2rem; font-weight: 800; color: #fff; line-height: 1; text-shadow: 0 0 15px var(--accent-glow); }
        .time-label { font-size: 0.65rem; text-transform: uppercase; color: #a1a1aa; font-weight: 700; margin-top: 6px; letter-spacing: 0.5px; }

        /* Badges & Rollen */
        .status-badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-user { background: rgba(217, 119, 6, 0.2); color: #facc15; border: 1px solid rgba(217, 119, 6, 0.3); }
        .status-dev { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); box-shadow: 0 0 15px var(--dev-glow); }

        /* Auth / Login Structuur */
        .auth-wrapper { width: 100%; min-height: 85vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .auth-card {
            background: var(--card-bg); border: 2px solid var(--card-border);
            border-radius: 30px; padding: 50px 45px; max-width: 480px; width: 100%;
            text-align: center; backdrop-filter: blur(25px); box-shadow: 0 35px 70px rgba(0,0,0,0.8);
        }

        /* Dev Mode Switch */
        .dev-switch-wrapper {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(0,0,0,0.5); padding: 14px; border-radius: 14px; margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.05); width: 100%;
        }
        .switch { position: relative; display: inline-block; width: 48px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #3f3f46; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--dev-color); box-shadow: 0 0 10px var(--dev-glow); }
        input:checked + .slider:before { transform: translateX(22px); }

        .footer-badge {
            position: fixed; bottom: 12px; right: 20px; background: var(--card-bg);
            border: 1px solid var(--card-border); padding: 8px 16px; border-radius: 12px;
            font-size: 0.8rem; color: #d1d5db; display: flex; align-items: center; gap: 8px; backdrop-filter: blur(10px); z-index: 1000;
        }
        .verified-badge { background: #3b82f6; color: white; border-radius: 50%; width: 16px; height: 16px; display: inline-flex; justify-content: center; align-items: center; font-size: 0.7rem; font-weight: 800; }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <!-- INLOGSCHERM -->
    <div id="authScreen" class="auth-wrapper">
        <div class="auth-card">
            <h2 style="color: #fff; font-size: 2rem; margin-bottom: 10px; font-weight: 800;">Welkom bij Ultimate Portal</h2>
            <p style="color: #a1a1aa; margin-bottom: 30px; font-size: 1rem;">Log in om toegang te krijgen tot het dashboard en tools.</p>
            
            <div class="form-group">
                <label for="usernameInput">Gebruikersnaam</label>
                <input type="text" id="usernameInput" placeholder="Bijv. David...">
            </div>

            <div class="dev-switch-wrapper">
                <span style="font-size: 0.95rem; font-weight: 600;">Inloggen als Developer</span>
                <label class="switch">
                    <input type="checkbox" id="devModeToggle">
                    <span class="slider"></span>
                </label>
            </div>

            <button class="btn" onclick="handleLogin()">Inloggen en Verifiëren</button>
        </div>
    </div>

    <!-- HOOFDNAVIGATIE -->
    <nav id="topNav">
