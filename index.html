<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Countdown Portaal & Beheer</title>
<style>
:root {
  --bg: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
  --card: rgba(15, 23, 42, 0.75);
  --border: rgba(139, 92, 246, 0.25);
  --accent: #a855f7;
  --glow: rgba(168, 85, 247, 0.4);
}

/* ===== MASTER THEMES ===== */
body.theme-cyberpunk {
  --bg: linear-gradient(135deg, #0b1329 0%, #172554 45%, #1e1b4b 100%);
  --card: rgba(15, 23, 42, 0.85);
  --border: rgba(99, 102, 241, 0.3);
  --accent: #6366f1;
  --glow: rgba(99, 102, 241, 0.4);
}
body.theme-sinterklaas {
  --bg: linear-gradient(135deg, #4c0519 0%, #991b1b 50%, #7c2d12 100%);
  --card: rgba(30, 4, 4, 0.88);
  --border: rgba(245, 158, 11, 0.4);
  --accent: #f59e0b;
  --glow: rgba(245, 158, 11, 0.4);
}
body.theme-kerst {
  --bg: linear-gradient(135deg, #064e3b 0%, #022c22 60%, #0f172a 100%);
  --card: rgba(6, 28, 22, 0.88);
  --border: rgba(239, 68, 68, 0.4);
  --accent: #ef4444;
  --glow: rgba(239, 68, 68, 0.4);
}
body.theme-koningsdag {
  --bg: linear-gradient(135deg, #7c2d12 0%, #ea580c 50%, #172554 100%);
  --card: rgba(30, 11, 3, 0.88);
  --border: rgba(59, 130, 246, 0.4);
  --accent: #3b82f6;
  --glow: rgba(234, 88, 12, 0.5);
}
body.theme-valentijn {
  --bg: linear-gradient(135deg, #4c0519 0%, #881337 50%, #db2777 100%);
  --card: rgba(36, 4, 13, 0.88);
  --border: rgba(244, 114, 182, 0.4);
  --accent: #f472b6;
  --glow: rgba(244, 114, 182, 0.4);
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
body {
  background: var(--bg);
  color: #f8fafc;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
  overflow-x: hidden;
  position: relative;
  transition: background 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

#effectCanvas {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  pointer-events: none;
  z-index: 1;
}

.app-container {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 1100px;
}

/* ===== INLOG & REGISTRATIE STYLING ===== */
.auth-wrapper {
  width: 100%;
  min-height: 85vh;
  display: flex;
  justify-content: center;
  align-items: center;
}
.auth-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 40px;
  width: 100%;
  max-width: 440px;
  backdrop-filter: blur(25px);
  box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  animation: authIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  text-align: center;
}
@keyframes authIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
.auth-logo { font-size: 3rem; margin-bottom: 12px; }
.auth-card h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 6px; }
.auth-card .subtitle { color: #94a3b8; font-size: 0.95rem; margin-bottom: 24px; }

.auth-tabs {
  display: flex; background: rgba(0,0,0,0.3);
  border-radius: 12px; padding: 4px; margin-bottom: 24px;
  border: 1px solid rgba(255,255,255,0.05);
}
.auth-tab {
  flex: 1; padding: 10px; border-radius: 9px; border: none;
  background: transparent; color: #94a3b8; font-weight: 600;
  font-size: 0.9rem; cursor: pointer; transition: all 0.3s ease;
}
.auth-tab.active { background: var(--accent); color: white; box-shadow: 0 4px 12px var(--glow); }

.form-group { margin-bottom: 18px; text-align: left; }
.form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
.form-group input, .form-group select {
  width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.4);
  border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white;
  font-size: 0.95rem; outline: none; transition: all 0.25s ease;
}
.form-group input:focus, .form-group select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }

.btn {
  background: var(--accent); color: white; border: none; padding: 13px 24px;
  font-size: 0.95rem; font-weight: 600; border-radius: 12px; cursor: pointer; transition: all 0.25s;
  box-shadow: 0 4px 16px var(--glow); display: inline-flex; justify-content: center; align-items: center; gap: 8px;
}
.btn:hover { filter: brightness(1.15); transform: translateY(-2px); box-shadow: 0 6px 20px var(--glow); }
.btn-full { width: 100%; }

.secret-buttons { position: absolute; top: 16px; right: 16px; display: flex; gap: 8px; z-index: 20; }
.secret-btn {
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.6); font-size: 0.75rem; font-weight: 600;
  padding: 8px 14px; border-radius: 10px; cursor: pointer; transition: all 0.25s; backdrop-filter: blur(5px);
}
.secret-btn:hover { color: white; background: rgba(255,255,255,0.15); border-color: var(--accent); }

/* ===== NAVIGATION APPLICATION ===== */
.app-wrapper { width: 100%; display: none; }
.app-wrapper.active { display: block; }

nav {
  width: 100%; display: flex; justify-content: space-between; align-items: center;
  background: var(--card); backdrop-filter: blur(20px); border: 1px solid var(--border);
  padding: 12px 20px; border-radius: 18px; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
}
.nav-links { display: flex; gap: 6px; flex-wrap: wrap; }
.nav-btn {
  background: none; border: none; color: #94a3b8; font-size: 0.85rem;
  font-weight: 600; cursor: pointer; padding: 10px 16px; border-radius: 10px; transition: all 0.25s;
}
.nav-btn.active, .nav-btn:hover { color: white; background: var(--accent); box-shadow: 0 4px 12px var(--glow); }

.container { width: 100%; display: none; flex-direction: column; gap: 20px; }
.container.active { display: flex; animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

.content-card, .timer-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 24px;
  backdrop-filter: blur(15px); box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  transition: transform 0.25s, border-color 0.4s ease;
}
.timer-card:hover { transform: translateY(-4px); }

.timer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.timer-title { font-size: 1.35rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.countdown-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.time-box { background: rgba(0,0,0,0.4); border-radius: 14px; padding: 16px 6px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
.time-value { font-size: 2rem; font-weight: 800; text-shadow: 0 0 15px var(--glow); color: #fff; }
.time-label { font-size: 0.7rem; text-transform: uppercase; color: #94a3b8; margin-top: 4px; font-weight: 600; letter-spacing: 0.5px; }

.clock-big { font-size: 4rem; font-weight: 800; text-align: center; text-shadow: 0 0 35px var(--glow); margin: 10px 0; }
.clock-date { text-align: center; color: #cbd5e1; font-size: 1.2rem; font-weight: 500; }

/* THEMA PREVIEW */
.theme-showcase-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 10px; }
.theme-preview-card {
  padding: 20px 14px; border-radius: 14px; text-align: center; cursor: pointer;
  font-weight: 700; font-size: 0.95rem; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); transition: all 0.25s;
}
.theme-preview-card.active { border-color: var(--accent); box-shadow: 0 0 16px var(--glow); transform: scale(1.03); }

/* INTERACTIEVE COMPONENTEN */
.interactive-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 768px) { .interactive-grid { grid-template-columns: 1fr; } }

.sound-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-top: 12px; }
.sound-btn {
  width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #fff;
  padding: 14px; border-radius: 12px; font-size: 1.3rem; cursor: pointer; transition: all 0.2s; text-align: center;
}
.sound-btn:hover { background: var(--accent); transform: scale(1.08); box-shadow: 0 4px 12px var(--glow); }
.sound-label { font-size: 0.75rem; color: #cbd5e1; display: block; margin-top: 4px; }

.todo-list { list-style: none; margin-top: 12px; }
.todo-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.todo-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }

/* OWNER INFRASTRUCTUUR */
.owner-layout { display: flex; gap: 24px; align-items: center; }
@media (max-width: 600px) { .owner-layout { flex-direction: column; text-align: center; } }
.owner-avatar {
  width: 110px; height: 110px; background: linear-gradient(45deg, var(--accent), #3b82f6);
  border-radius: 50%; display: flex; justify-content: center; align-items: center;
  font-size: 3rem; box-shadow: 0 0 20px var(--glow); border: 3px solid rgba(255,255,255,0.2);
}
.owner-info h2 { font-size: 1.6rem; font-weight: 700; margin-bottom: 6px; }
.owner-badge { background: var(--accent); color: white; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; display: inline-block; margin-bottom: 10px; }
.owner-links { display: flex; gap: 10px; margin-top: 12px; }
.owner-link { color: #fff; text-decoration: none; font-size: 0.85rem; background: rgba(255,255,255,0.08); padding: 6px 12px; border-radius: 8px; }
.owner-link:hover { background: var(--accent); }

.admin-card { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05); border-radius: 14px; padding: 18px; margin-top: 12px; }
</style>
</head>
<body class="theme-cyberpunk">

<canvas id="effectCanvas"></canvas>

<div class="secret-buttons">
  <button class="secret-btn" onclick="quickDevLogin()">⚡ Dev Login</button>
</div>

<div class="app-container">
  
  <!-- ===== INLOG & REGISTRATIE ===== -->
