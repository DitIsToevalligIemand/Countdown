<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feestdagen, Kalender & Concerten Portaal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #2b1104 0%, #3d1502 50%, #631704 100%);
            --card-bg: rgba(38, 18, 9, 0.9);
            --card-border: rgba(245, 158, 11, 0.4);
            --text-color: #fef3c7;
            --accent-color: #d97706;
            --accent-glow: rgba(217, 119, 6, 0.5);
            --glimmer-gold: #fde047;
        }

        body.christmas-theme {
            --bg-gradient: linear-gradient(135deg, #022c22 0%, #064e3b 50%, #7f1d1d 100%);
            --card-bg: rgba(15, 23, 42, 0.92);
            --card-border: rgba(52, 211, 153, 0.4);
            --text-color: #f0fdf4;
            --accent-color: #059669;
            --accent-glow: rgba(5, 150, 105, 0.5);
            --glimmer-gold: #fbbf24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            padding-bottom: 70px;
            transition: all 0.5s ease-in-out;
        }

        nav {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            padding: 14px 22px;
            border-radius: 18px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .nav-links {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: none;
            border: none;
            color: #d1d5db;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 10px;
        }

        .nav-btn.active,
        .nav-btn:hover {
            color: #fff;
            background: rgba(217, 119, 6, 0.35);
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .container.active {
            display: flex;
        }

        .auth-wrapper {
            width: 100%;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .auth-card {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 28px;
            padding: 45px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(20px);
        }

        .glimmer-card {
            background: linear-gradient(
                135deg,
                rgba(255,255,255,0.06),
                rgba(253,224,71,0.18),
                rgba(255,255,255,0.06)
            );
            border: 2px solid var(--glimmer-gold);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 18px;
        }

        .timer-card,
        .content-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .timer-card {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .timer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .timer-title {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .time-box {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(245,158,11,0.25);
            border-radius: 12px;
            padding: 12px 5px;
            text-align: center;
        }

        .time-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
        }

        .time-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #d1d5db;
            margin-top: 4px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(0,0,0,0.3);
            margin-top: 15px;
        }

        .data-table th,
        .data-table td {
            padding: 14px 18px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .data-table th {
            background: rgba(0,0,0,0.5);
            color: var(--glimmer-gold);
        }

        .radio-player-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: rgba(0,0,0,0.35);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
        }

        .radio-stations {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .radio-station-btn {
            background: rgba(255,255,255,.10);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 9px 13px;
            border-radius: 10px;
            cursor: pointer;
        }

        .radio-station-btn:hover {
            background: var(--accent-color);
            color: white;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px,1fr));
            gap: 12px;
        }

        .search-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 14px 0;
        }

        .search-row input {
            flex: 1;
            min-width: 180px;
        }

        .small-note {
            color: #cbd5e1;
            font-size: .82rem;
            line-height: 1.5;
        }

        .btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
        }

        .btn-danger {
            background: #b91c1c;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--glimmer-gold);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: rgba(0,0,0,0.3);
            color: white;
        }

        @media (max-width: 600px) {
            .countdown-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .auth-card {
                padding: 25px;
            }

            nav {
                justify-content: center;
            }
        }
    </style>
</head>
