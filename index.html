<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Portal & TikTok Skin Maker</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --card-bg: rgba(30, 15, 8, 0.9);
            --card-border: rgba(245, 158, 11, 0.4);
            --text-color: #fef3c7;
            --accent-color: #d97706;
            --accent-glow: rgba(217, 119, 6, 0.5);
            --glimmer-gold: #fde047;
            --dev-color: #3b82f6;
            --dev-glow: rgba(59, 130, 246, 0.5);
            --success-color: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        
        #bgCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: linear-gradient(135deg, #1b0c04 0%, #2b1104 50%, #4a1502 100%);
        }

        body {
            color: var(--text-color); min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            padding: 20px; padding-bottom: 70px; overflow-x: hidden;
        }

        /* Navigatie */
        nav {
            width: 100%; max-width: 1100px;
            display: none; justify-content: space-between; align-items: center;
            background: var(--card-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--card-border); padding: 12px 22px;
            border-radius: 20px; margin-bottom: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); flex-wrap: wrap; gap: 10px;
        }
        .nav-links { display: flex; gap: 6px; flex-wrap: wrap; }
        .nav-btn {
            background: none; border: none; color: #d1d5db;
            font-size: 0.85rem; font-weight: 600; cursor: pointer;
            padding: 8px 14px; border-radius: 12px; transition: all 0.3s;
        }
        .nav-btn.active, .nav-btn:hover { color: #fff; background: rgba(217, 119, 6, 0.4); transform: translateY(-2px); box-shadow: 0 4px 12px var(--accent-glow); }

        /* Containers & Cards */
        .container { width: 100%; max-width: 1100px; display: none; flex-direction: column; gap: 20px; }
        .container.active { display: flex; animation: fadeIn 0.4s ease forwards; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .content-card {
            background: var(--card-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--card-border); border-radius: 20px;
            padding: 28px; box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }
        
        /* Countdown Klokken */
        .timer-card {
            background: rgba(0, 0, 0, 0.4); border: 1px solid var(--card-border); border-radius: 18px;
            padding: 20px; display: flex; flex-direction: column; gap: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); transition: all 0.3s;
        }
        .timer-header { display: flex; justify-content: space-between; align-items: center; }
        .timer-title { font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 8px; color: var(--text-color); }
        .countdown-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .time-box {
            background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(245, 158, 11, 0.25);
            border-radius: 10px; padding: 12px 4px; text-align: center;
        }
        .time-value { font-size: 1.6rem; font-weight: 800; color: #fff; line-height: 1; text-shadow: 0 0 10px var(--accent-glow); }
        .time-label { font-size: 0.65rem; text-transform: uppercase; color: #d1d5db; font-weight: 600; margin-top: 4px; }

        /* Skin Maker Layout */
        .skin-maker-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media(max-width: 768px) { .skin-maker-grid { grid-template-columns: 1fr; } }
        
        .skin-preview-box {
            background: rgba(0,0,0,0.6); border: 2px dashed var(--card-border);
            border-radius: 16px; min-height: 380px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; position: relative; padding: 20px; gap: 15px;
            text-align: center;
        }

        /* Formulieren & Knoppen */
        .btn {
            background: var(--accent-color); color: white; border: none;
            padding: 12px 20px; font-size: 0.95rem; font-weight: 600; border-radius: 12px;
            cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 15px var(--accent-glow);
            width: 100%;
        }
        .btn:hover { filter: brightness(1.2); transform: translateY(-2px); }
        .btn-danger { background: #b91c1c; box-shadow: 0 4px 15px rgba(185, 28, 28, 0.4); }
        
        .form-group { margin-bottom: 15px; text-align: left; width: 100%; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--glimmer-gold); }
        .form-group input, .form-group select {
            width: 100%; padding: 12px; background: rgba(0,0,0,0.5);
            border: 1px solid rgba(245, 158, 11, 0.35); border-radius: 12px; color: white; font-size: 0.95rem; outline: none;
        }

        /* Badges & Rollen */
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; text-transform: uppercase; }
        .status-user { background: rgba(217, 119, 6, 0.2); color: #facc15; border: 1px solid rgba(217, 119, 6, 0.3); }
        .status-dev { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); box-shadow: 0 0 10px var(--dev-glow); }

        /* Auth / Login Structuur */
        .auth-wrapper { width: 100%; min-height: 80vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .auth-card {
            background: var(--card-bg); border: 2px solid var(--card-border);
            border-radius: 30px; padding: 45px; max-width: 480px; width: 100%;
            text-align: center; backdrop-filter: blur(25px); box-shadow: 0 35px 70px rgba(0,0,0,0.8);
        }

        /* Dev Schakelaar */
        .dev-switch-wrapper {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(0,0,0,0.4); padding: 12px; border-radius: 12px; margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05); width: 100%;
        }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #3f3f46; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--dev-color); }
        input:checked + .slider:before { transform: translateX(20px); }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <!-- INLOGSCHERM -->
    <div id="authScreen" class="auth-wrapper">
        <div class="auth-card">
            <h2 style="color: #fff; margin-bottom: 10px;">Welkom bij Ultimate Portal</h2>
            <p style="color: #a1a1aa; margin-bottom: 25px;">Log in om toegang te krijgen tot het dashboard en tools.</p>
            
            <div class="form-group">
                <label for="usernameInput">Gebruikersnaam</label>
                <input type="text" id="usernameInput" placeholder="Bijv. Gamer123...">
            </div>

            <div class="dev-switch-wrapper">
                <span style="font-size: 0.9rem; font-weight: 600;">Inloggen als Developer</span>
                <label class="switch">
                    <input type="checkbox" id="devModeToggle">
                    <span class="slider"></span>
                </label>
            </div>

            <button class="btn" onclick="handleLogin()">Inloggen en Verifiëren</button>
        </div>
    </div>

    <!-- HOOFDNAVIGATIE -->
    <nav id="topNav">
        <div class="nav-links">
            <button class="nav-btn active" id="btnDashboardTab" onclick="switchTab('dashboardTab')">🎁 Dashboard</button>
            <button class="nav-btn" id="btnSkinTab" onclick="switchTab('skinTab')">🎮 TikTok Skin Maker</button>
            <button class="nav-btn" id="btnTimersTab" onclick="switchTab('timersTab')">⏱️ Countdowns</button>
            <button class="nav-btn" id="btnSchoolTab" onclick="switchTab('schoolTab')">🎓 Examen & Vakanties</button>
            <button class="nav-btn" id="btnRadioTab" onclick="switchTab('radioTab')">📻 Radio</button>
            <button class="nav-btn" id="btnAboutTab" onclick="switchTab('aboutTab')">🙋 Over</button>
            <button class="nav-btn" id="btnDevTab" onclick="switchTab('devTab')" style="display: none; color: #60a5fa;">🛠️ Dev Panel</button>
        </div>
        <div style="display: flex; align-items: center; gap: 12px;">
            <span id="roleBadge" class="status-badge"></span>
            <span id="userDisplay" style="font-size: 0.88rem; font-weight: 700;"></span>
            <button class="btn btn-danger" style="padding: 6px 12px; font-size: 0.8rem; width: auto;" onclick="handleLogout()">Uitloggen</button>
        </div>
    </nav>

    <!-- TAB 1: DASHBOARD -->
    <div id="dashboardTab" class="container active">
        <div class="content-card">
            <h2 style="margin-bottom: 10px;">🎁 Dashboard Overview</h2>
            <p>Welkom terug! Je lay-out is volledig vernieuwd en hersteld. Gebruik het menu hierboven om te navigeren.</p>
